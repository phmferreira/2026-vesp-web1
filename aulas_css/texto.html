<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Id e Classe em CSS</title>
    <style>
        p{
            text-align: center;
            color: blue;
        }
        #primeiro-parag{
            text-align: right;
            color: darkgreen;
        }
        .estilo-padrao{
            font-style: italic;
            border: 3px solid black;
            margin: 20px;
            padding: 15px;
            text-align: justify;
            color: black;
        }
    </style>
</head>
<body>
    <p id="primeiro-parag">Primeiro parágrafo</p>
    <p class="estilo-padrao">Segundo parágrafo</p>
    <p class="estilo-padrao">Terceiro parágrafo</p>
    <p>Quarto parágrafo</p>
    <p>Quinto parágrafo</p>
</body>
</html>
