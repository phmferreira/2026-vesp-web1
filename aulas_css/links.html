<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Links</title>
    <style>
        a{
            color: red;
        }
        a[href="https://www.ifpb.edu.br"]{
            color: green;
        }
        a:visited{
            color: brown;
        }
        a:hover{
            font-size: 1.5rem;
        }
        a:active{
            color: blue;
        }
    </style>
</head>
<body>
    <a href="https://www.google.com">google</a>
    <a href="https://www.ifpb.edu.br">IFPB</a>
    <a href="https://suap.ifpb.edu.br">SUAP</a>
</body>
</html>
